<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background circle with neural network theme -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e5e7eb;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Neural network inspired background -->
  <circle cx="16" cy="16" r="15" fill="url(#bgGradient)" stroke="#1e40af" stroke-width="1"/>
  
  <!-- Subtle neural connections -->
  <circle cx="6" cy="8" r="1.5" fill="#60a5fa" opacity="0.6"/>
  <circle cx="26" cy="12" r="1" fill="#60a5fa" opacity="0.4"/>
  <circle cx="24" cy="26" r="1.2" fill="#60a5fa" opacity="0.5"/>
  <circle cx="8" cy="24" r="1" fill="#60a5fa" opacity="0.4"/>
  
  <!-- Connection lines -->
  <line x1="6" y1="8" x2="16" y2="16" stroke="#60a5fa" stroke-width="0.5" opacity="0.3"/>
  <line x1="26" y1="12" x2="16" y2="16" stroke="#60a5fa" stroke-width="0.5" opacity="0.3"/>
  <line x1="24" y1="26" x2="16" y2="16" stroke="#60a5fa" stroke-width="0.5" opacity="0.3"/>
  
  <!-- Letter R -->
  <text x="16" y="22" font-family="Arial, sans-serif" font-size="18" font-weight="bold" 
        text-anchor="middle" fill="url(#textGradient)">R</text>
</svg>
